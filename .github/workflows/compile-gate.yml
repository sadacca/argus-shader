name: Cross-backend compile gate

# T-002: portability validated continuously from Phase 0 (docs/review-notes.md
# P1), not ported for in Phase 2. Runs the stub .slang pass (and any real
# passes added later under shaders/) through glslang -> SPIR-V -> spirv-cross
# for every backend target named in docs/requirements.md's NFR list.

on:
  push:
  pull_request:

jobs:
  compile-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install slang toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools spirv-tools spirv-cross

      - name: Compile stub pass across all backend targets
        run: python3 tools/compile_gate/compile_check.py

      - name: Compile shipped shader passes (once any exist)
        run: |
          shopt -s nullglob
          passes=(shaders/**/*.slang)
          if [ ${#passes[@]} -gt 0 ]; then
            python3 tools/compile_gate/compile_check.py "${passes[@]}"
          else
            echo "no shipped .slang passes yet"
          fi
